server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API base is injected at container start by docker-entrypoint.sh, so
    # one image works against localhost in dev and any host in deployment
    # without a rebuild.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
