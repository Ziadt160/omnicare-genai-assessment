# Values the policyholder never gave, in the text they are shown.
#
# Reported from a real session. Told only "I had a pipe burst in my kitchen",
# the model answered in prose - no tool call - with:
#
#   - **Policy Number**: POL-1092
#   Since we don't have a specific amount yet, I will use $100,000 as an
#   initial estimate.
#   Do you want to proceed with submitting this claim?
#
# The confirmation gate held: nothing was written, because the write was
# refused a turn later when the model finally called submit_claim. But no tool
# call means no confirmation node, so nothing stood between that message and
# the policyholder - and POL-1092 is a live row in mock_claims.json belonging
# to somebody else.
#
# These cases script the model into producing exactly that, the way EV-08
# scripts a fabricated citation, so what is under test is whether `ground`
# removes it rather than whether a 7B happens to behave on the day.

- id: EV-49
  bucket: fabricated_values
  message: "I had a pipe burst in my kitchen"
  expect:
    # The reply is replaced wholesale rather than edited: stripping the number
    # out would leave a message still offering to file, now with nothing to
    # file against. The correct reply is the demand the confirmation gate would
    # have made, moved to where the damage happens.
    must_not_contain: ["POL-1092", "$100,000", "do you want to proceed"]
    contains_any: ["policy number"]
    claim_written: false

- id: EV-50
  bucket: fabricated_values
  message: "A pipe burst in my kitchen, please file it on POL-4417"
  expect:
    # The policy number here WAS given, so it must survive - the check is "did
    # they say it", not "is there a policy number in this text". What must not
    # survive is the amount, which nobody stated.
    must_not_contain: ["$100,000"]
    contains_any: ["how much"]
    claim_written: false
