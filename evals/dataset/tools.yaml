# Tool selection and argument extraction.
#
# Gates: tool-selection accuracy >= 0.90, tool-arg exact match >= 0.95. These
# are model-dependent, so not 1.00 - but a drop below threshold means the tool
# docstrings regressed, which is the actionable signal.

- id: EV-11
  bucket: tool_selection
  message: "What is the status of claim CLM-8821?"
  expect:
    tools_called: ["get_claim_status"]
    tool_args: {claim_id: "CLM-8821"}
    must_not_call: ["submit_claim"]
    contains_any: ["Approved"]

- id: EV-12
  bucket: tool_selection
  message: "Has CLM-9014 been decided yet?"
  expect:
    tools_called: ["get_claim_status"]
    tool_args: {claim_id: "CLM-9014"}
    contains_any: ["Under Review"]

- id: EV-13
  bucket: tool_recovery
  message: "Check claim CLM-0000 for me."
  expect:
    tools_called: ["get_claim_status"]
    contains_any: ["not found", "could not find", "couldn't find", "cannot find",
                   "can't find", "no claim", "unable to find"]
    must_not_contain: ["Approved", "Under Review", "Denied"]

- id: EV-14
  bucket: tool_args
  message: "File a water damage claim on POL-1092 for $1,200 - washing machine overflowed."
  expect:
    tools_called: ["submit_claim"]
    tool_args:
      policy_number: "POL-1092"
      claim_type: "Water Damage"
      amount: "1200.00"
    requires_confirmation: true

- id: EV-15
  bucket: tool_args
  # Carries all four arguments. The earlier wording omitted a description, so
  # a correct model asked for one - which is what the submit_claim docstring
  # tells it to do, and made this case assert the opposite of its intent.
  # EV-16 is the case that tests asking for missing arguments.
  # No "car": the previous wording said the laptop was stolen "from my car",
  # and the model classified it Auto rather than Personal Property. That is a
  # defensible reading, so the ambiguity was the test's fault - this case
  # exists to check argument extraction, not to probe classification edges.
  message: "I need to file a claim on policy POL-3341 for $900 - my laptop was
    stolen while I was travelling."
  expect:
    tools_called: ["submit_claim"]
    tool_args:
      policy_number: "POL-3341"
      claim_type: "Personal Property"
      amount: "900.00"
    requires_confirmation: true

- id: EV-16
  bucket: tool_args
  message: "I want to file a claim."
  expect:
    tools_called: []
    contains_any: ["policy number", "which policy", "what happened", "how much"]

- id: EV-17
  bucket: tool_selection
  message: "Is a burst pipe covered, and what is the status of CLM-8821?"
  expect:
    tools_called: ["search_policy_documents", "get_claim_status"]
    cites: ["sample_policy.md § Section 1: Home Water Damage Coverage"]

- id: EV-18
  bucket: confirmation
  message: "File a water damage claim on POL-1092 for $1,200 - pipe burst."
  followup: "no, cancel that"
  expect:
    claim_written: false
    contains_any: ["cancel", "not filed", "haven't filed", "no claim"]

# A coverage question must be searched, not deferred. The policy document is
# one shared document; a policy number identifies the *policyholder* and is
# needed to file a claim, never to look up what the policy says.
#
# Observed live on qwen2.5:7b: "a pipe purst in my kitchen, am I covered?"
# returned "Could you please provide your policy number (POL-####) so I can
# check the coverage details?" - no search, no citation, and a question the
# policyholder cannot usefully answer. Rule 3 of the system prompt
# ("if you do not have a value, ask for it") was being applied to a value the
# answer does not depend on.

- id: EV-35
  bucket: tool_selection
  message: "A pipe burst in my kitchen, am I covered?"
  expect:
    tools_called: ["search_policy_documents"]
    must_not_call: ["get_claim_status", "submit_claim"]
    # Asserts the outcome, not the phrasing: the answer is *given*, with the
    # real limit in it. Forbidding the words "policy number" was the wrong
    # test - offering to file a claim and asking for one then is correct
    # behaviour, and the same case passed or failed run to run on wording
    # alone. What must never happen is the answer being withheld pending a
    # value the answer does not depend on.
    contains_any: ["25,000", "25000"]

- id: EV-36
  bucket: tool_selection
  # Deliberately misspelled: this is how it was typed when the bug surfaced,
  # and a small model working harder on the wording is likelier to fall back
  # on a clarifying question instead of searching.
  message: "a pipe purst in my kitchen, am I covered?"
  expect:
    tools_called: ["search_policy_documents"]
    contains_any: ["25,000", "25000"]

- id: EV-37
  bucket: tool_selection
  message: "Is jewelry covered if it is stolen?"
  expect:
    tools_called: ["search_policy_documents"]
    contains_any: ["10,000", "10000"]

# Filing a claim needs four arguments and nothing else. Observed live: asked to
# file for a ruined television, the assistant demanded "the exact value" and
# "whether you have individual appraisal receipts for items exceeding $2,500",
# then - told the TV was worth $1,500 - replied that a receipt "is required
# since its value exceeds $2,500". It is not: $1,500 is less than $2,500. A
# documentation rule in the policy was turned into a gate in front of the
# claim, on arithmetic that was backwards.

- id: EV-38
  bucket: tool_selection
  message: "A pipe burst and ruined my $1,500 television. I want to file a claim on POL-1092."
  expect:
    # Filing does not require a search - the four arguments are the whole
    # requirement, which is the point of the case.
    tools_called: ["submit_claim"]
    requires_confirmation: true
    # The appraisal threshold is not crossed, so it must not be raised as a
    # requirement at all.
    must_not_contain: ["exceeds $2,500", "exceeds $2500"]

- id: EV-39
  bucket: grounding
  message: "My television is worth $1,500. Do I need an appraisal receipt for it?"
  expect:
    tools_called: ["search_policy_documents"]
    contains_any: ["do not need", "don't need", "not need", "no appraisal",
                   "not required", "under", "below", "less than"]
    must_not_contain: ["exceeds $2,500", "exceeds $2500"]
