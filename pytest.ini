[pytest]
# The repo root as well as backend/: evals/ has no __init__.py, so the eval
# modules import as `evals.runner` only when the root is importable.
# `python -m pytest` prepends the working directory and hid this; bare
# `pytest` does not, so the two invocations collected different suites
# until CI ran the second one.
pythonpath = . backend
testpaths = tests evals
asyncio_mode = auto
markers =
    live: hits a real LLM provider; excluded from CI (see spec §16)
    integration: needs Redis/Postgres via testcontainers
    e2e: needs the full docker compose stack
filterwarnings = error::DeprecationWarning
